[project]
name = "ely"
version = "2.0.0"
description = "Ely — agent IA personnel autonome, multi-modèles, multi-utilisateurs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Franck Ollivier" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "anthropic>=1.8",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "playwright>=1.45",
    "trafilatura>=1.12",
    "beautifulsoup4>=4.12",
    "pypdf>=4.0",
    "ddgs>=9.0",
    "croniter>=2.0",
    "pywebpush>=2.0",
    "cryptography>=42",
    "numpy>=1.26",
    "pillow>=10",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "reportlab>=4.0",
    "matplotlib>=3.8",
    "pandas>=2.1",
    "mcp>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
ely = "ely.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ely*"]

[tool.setuptools.package-data]
ely = ["web/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
